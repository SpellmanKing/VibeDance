<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeDance - Painel Administrativo</title>
    <!-- Importando o CSS global -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-compact-disc"></i> VibeDance
        </div>
        <ul class="nav-menu">
            <li class="ativo"><i class="fas fa-layer-group"></i> Modalidades</li>
            <li><i class="fas fa-calendar-check"></i> Turmas & Horários</li>
            <li><i class="fas fa-users"></i> Alunos</li>
            <li><i class="fas fa-chart-line"></i> Relatórios</li>
            <li style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-sign-out-alt"></i> Sair
            </li>
        </ul>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        
        <!-- CABEÇALHO -->
        <header class="header-boas-vindas">
            <div>
                <h1>Gestão do Estúdio</h1>
                <p>Controle as modalidades, turmas e acompanhe o desempenho do negócio.</p>
            </div>
            <div class="perfil-usuario">
                <div class="avatar" style="background: linear-gradient(135deg, #333, #666);">AD</div>
                <span style="font-weight: 600; color: #2b0a3d;">Administrador</span>
                <i class="fas fa-chevron-down" style="color: #ccc; cursor: pointer;"></i>
            </div>
        </header>

        <!-- SEÇÃO: GERENCIAR MODALIDADES (Layout em 2 colunas no Desktop) -->
        <div class="admin-grid duas-colunas">
            
            <!-- CARD 1: FORMULÁRIO -->
            <div class="card-admin">
                <h2><i class="fas fa-plus-circle" style="color: var(--roxo-vibrante);"></i> Nova Modalidade</h2>
                <form id="form-modalidade">
                    <div class="form-group">
                        <label for="nome">Nome da Modalidade:</label>
                        <input type="text" id="nome" required placeholder="Ex: Ballet Clássico">
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição:</label>
                        <textarea id="descricao" rows="4" required placeholder="Detalhes sobre as aulas..."></textarea>
                    </div>
                    <button type="submit" class="btn-acao">Salvar Modalidade</button>
                </form>
            </div>

            <!-- CARD 2: LISTAGEM -->
            <div class="card-admin">
                <h2><i class="fas fa-list" style="color: var(--roxo-vibrante);"></i> Modalidades Ativas</h2>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-modalidades">
                            <!-- Inserido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SEÇÃO: GERENCIAR TURMAS -->
        <div class="admin-grid">
            <div class="card-admin">
                <h2><i class="fas fa-clock" style="color: var(--roxo-vibrante);"></i> Cadastrar Nova Turma</h2>
                <form id="form-turma" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="modalidade-select">Modalidade:</label>
                        <select id="modalidade-select" required>
                            <option value="">Carregando modalidades...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="dias">Dias da Semana:</label>
                        <input type="text" id="dias" required placeholder="Ex: Segundas e Quartas">
                    </div>
                    
                    <div class="form-group">
                        <label for="horario">Horário:</label>
                        <input type="time" id="horario" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="vagas">Limite de Vagas:</label>
                        <input type="number" id="vagas" required min="1" placeholder="Ex: 20">
                    </div>

                    <div style="grid-column: 1 / -1; margin-top: 10px;">
                        <button type="submit" class="btn-acao">Salvar Turma</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- O MESMO JAVASCRIPT CONTINUA FUNCIONANDO -->
    <script src="admin.js"></script>
</body>
</html>
