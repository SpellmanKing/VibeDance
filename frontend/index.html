<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeDance - Entre na sua conta</title>
    <!-- Importando o CSS global -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Substitui o comportamento padrão do body apenas para esta página */
        body.login-page {
            display: flex;
            flex-direction: row;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: var(--cor-fundo);
        }

        /* Lado Esquerdo: Marca e Vibe (Visual) */
        .login-banner {
            flex: 1.2;
            background: linear-gradient(135deg, var(--roxo-profundo) 0%, var(--roxo-vibrante) 100%);
            color: var(--cor-branco);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 40px;
        }

        /* Formas geométricas abstratas para dar movimento ao fundo */
        .forma-abstrata {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 0;
        }
        .forma-1 { width: 300px; height: 300px; top: -50px; left: -100px; }
        .forma-2 { width: 500px; height: 500px; bottom: -150px; right: -150px; }
        .forma-3 { width: 150px; height: 150px; top: 40%; left: 20%; background: rgba(184, 41, 255, 0.1); }

        .banner-conteudo {
            z-index: 1;
        }

        .banner-conteudo h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(184, 41, 255, 0.8);
        }

        .banner-conteudo p {
            font-size: 1.2rem;
            opacity: 0.85;
            margin-top: 10px;
            font-weight: 300;
        }

        /* Lado Direito: Formulário de Login */
        .login-form-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--cor-fundo);
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--cor-branco);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border-top: 5px solid var(--roxo-neon);
        }

        .login-card h2 {
            margin-top: 0;
            color: var(--roxo-profundo);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-card p.subtitulo {
            color: #777;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Estilizando os inputs com ícones embutidos */
        .input-icon-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .input-icon-wrapper i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        .input-icon-wrapper input {
            padding-left: 45px;
            height: 50px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .input-icon-wrapper input:focus {
            border-color: var(--roxo-vibrante);
            box-shadow: 0 0 10px rgba(108, 99, 255, 0.1);
        }

        .input-icon-wrapper input:focus + i,
        .input-icon-wrapper input:valid + i {
            color: var(--roxo-vibrante);
        }

        /* Responsividade para telas menores (celulares) */
        @media (max-width: 768px) {
            body.login-page { flex-direction: column; }
            .login-banner { flex: 0.6; padding: 20px; }
            .banner-conteudo h1 { font-size: 2.5rem; }
            .login-card { padding: 30px 20px; box-shadow: none; border: none; background: transparent; }
        }
    </style>
</head>
<body class="login-page">

    <!-- Lado Esquerdo Visual -->
    <div class="login-banner">
        <div class="forma-abstrata forma-1"></div>
        <div class="forma-abstrata forma-2"></div>
        <div class="forma-abstrata forma-3"></div>
        
        <div class="banner-conteudo">
            <h1><i class="fas fa-compact-disc"></i> VibeDance</h1>
            <p>O ritmo do seu estúdio, organizado em um só lugar.</p>
        </div>
    </div>

    <!-- Lado Direito Formulário -->
    <div class="login-form-area">
        <div class="login-card">
            <h2>Bem-vindo de volta!</h2>
            <p class="subtitulo">Insira suas credenciais para acessar sua conta.</p>

            <form id="form-login">
                <div class="input-icon-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" required placeholder="Seu e-mail cadastrado">
                </div>
                
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senha" required placeholder="Sua senha secreta">
                </div>
                
                <button type="submit" class="btn-acao" style="height: 50px; font-size: 18px; margin-top: 10px;">
                    Entrar no Sistema <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 25px;">
                <a href="#" style="color: var(--roxo-vibrante); text-decoration: none; font-size: 14px; font-weight: 600;">Esqueceu sua senha?</a>
            </div>
        </div>
    </div>

    <!-- Mantemos a mesma lógica de redirecionamento que já criamos -->
    <script src="login.js"></script>
</body>
</html>
