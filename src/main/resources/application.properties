spring.application.name=VibeDance
server.port=8080

# Conexao com PostgreSQL de testes
spring.datasource.url=jdbc:postgresql://localhost:5433/vibedance_teste
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Nao criar nem alterar tabelas automaticamente
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

spring.jpa.open-in-view=false

#Diretorio de armazenamento dos comprovantes 
vibedance.upload-dir=${UPLOAD_DIR:uploads/comprovantes}

#Limite para envio de comprovantes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#Integracao Mercado Pago
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}