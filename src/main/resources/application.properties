spring.application.name=VibeDance
server.port=8080

# Conexao com PostgreSQL de testes
spring.datasource.url=jdbc:postgresql://localhost:5433/vibedance_teste
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Nao criar nem alterar tabelas automaticamente
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

spring.jpa.open-in-view=false

#Diretorio de armazenamento dos comprovantes 
vibedance.upload-dir=${UPLOAD_DIR:uploads/comprovantes}
#Fotos de perfil (JPG/PNG/WebP até 3 MB, validadas pelo conteúdo)
vibedance.avatar-dir=${AVATAR_DIR:uploads/avatars}

#Limite para envio de comprovantes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#Integracao Mercado Pago
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# Origens liberadas no CORS quando o front roda fora do Spring (Live Server / server.ps1)
vibedance.cors.origens=${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081}

# Fuso padrão para regras de agenda, vencimentos e chamada
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
