spring.application.name=VibeDance
server.port=8080

# Conexao com PostgreSQL de testes
spring.datasource.url=jdbc:postgresql://localhost:5433/vibedance_teste
spring.datasource.username=${DB_USER}
spring.datasource.password=$andei os d{DB_PASSWORD}

# Nao criar nem alterar tabelas automaticamente
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

spring.jpa.open-in-view=false